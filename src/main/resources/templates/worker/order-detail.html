<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'维修任务 #' + order.id + ' · FixCampus'}">维修任务详情 · FixCampus</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/auth.js}"></script>
</head>
<body class="worker-page worker-detail-page">
<a class="skip-link" href="#main">跳到任务详情</a>
<header th:replace="~{fragments/worker :: header}"></header>
<main class="workspace" id="main">
    <nav class="breadcrumb" aria-label="当前位置"><a th:href="@{/worker/orders}">我的任务</a><span aria-hidden="true"> / </span><span aria-current="page">任务详情</span></nav>
    <div class="page-heading"><div><p class="order-reference" th:text="${'工单 #' + order.id}"></p><h1>维修任务详情</h1><p>了解报修情况，按实际进展更新处理状态。</p></div><span th:replace="~{fragments/student :: status(${order.status})}"></span></div>
    <div class="notice notice-success" role="status" th:if="${successMessage != null}" th:text="${successMessage}"></div>
    <div class="detail-layout">
        <div class="worker-detail-main">
            <section class="surface detail-content" aria-labelledby="information-title">
                <h2 id="information-title">报修信息</h2>
                <dl class="detail-fields">
                    <div class="detail-location"><dt>报修地点</dt><dd th:text="${order.location}"></dd></div>
                    <div><dt>故障类型</dt><dd th:text="${order.category.label}"></dd></div>
                    <div class="full-width detail-description"><dt>问题描述</dt><dd class="plain-text" th:text="${order.description}"></dd></div>
                    <div class="full-width detail-description" th:if="${order.repairResult != null}"><dt>维修说明</dt><dd class="plain-text" th:text="${order.repairResult}"></dd></div>
                </dl>
                <div class="detail-meta">
                    <p>提交时间 <time th:datetime="${order.createdAt}" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></time></p>
                    <p th:if="${order.completedAt != null}">完成时间 <time th:datetime="${order.completedAt}" th:text="${#temporals.format(order.completedAt, 'yyyy-MM-dd HH:mm')}"></time></p>
                </div>
            </section>
            <section class="surface contact-card" aria-labelledby="contact-title">
                <h2 id="contact-title">报修人联系信息</h2>
                <dl class="detail-fields">
                    <div><dt>报修学生</dt><dd th:text="${order.studentName}"></dd></div>
                    <div><dt>联系方式</dt><dd th:text="${order.studentPhone ?: '未提供'}"></dd></div>
                </dl>
            </section>
            <section th:replace="~{fragments/order-history :: history(${order.history()})}"></section>
        </div>
        <aside class="order-actions" aria-labelledby="progress-title">
            <div th:if="${order.canStart()}">
                <h2 id="progress-title">开始处理</h2>
                <p>准备处理这张工单时，点击“开始维修”。</p>
                <form th:action="@{/worker/orders/{id}/start(id=${order.id})}" method="post" novalidate data-auth-form data-pending-label="更新中…">
                    <button class="button button-primary" type="submit">开始维修</button>
                    <p class="visually-hidden" role="status" data-submit-status></p>
                </form>
            </div>
            <div th:if="${order.canComplete()}">
                <h2 id="progress-title">提交维修结果</h2>
                <p>维修处理完毕后提交，工单将进入待确认状态。</p>
                <form class="order-form repair-completion-form" th:action="@{/worker/orders/{id}/complete(id=${order.id})}" method="post" th:object="${completeRepairForm}" novalidate data-auth-form data-pending-label="提交中…">
                    <div class="notice notice-error error-summary" role="alert" th:if="${#fields.hasAnyErrors()}">
                        <h3>请检查维修说明</h3>
                        <p><a href="#repairResult" data-error-target="repairResult">修改维修说明后重新提交。</a></p>
                    </div>
                    <div class="field">
                        <label for="repairResult">维修说明（选填）</label>
                        <textarea id="repairResult" th:field="*{repairResult}" rows="7" placeholder="例如：故障原因、处理方式及使用注意事项" autocomplete="off" aria-describedby="repair-result-help repair-result-error" th:attr="aria-invalid=${#fields.hasErrors('repairResult')}"></textarea>
                        <p class="character-count" data-character-count-for="repairResult" hidden aria-hidden="true"></p>
                        <p class="field-help" id="repair-result-help">最多 1000 个字符，可说明处理方式及使用注意事项。留空也可提交。</p>
                        <p class="field-error" id="repair-result-error" role="alert"><span th:errors="*{repairResult}"></span></p>
                    </div>
                    <button class="button button-primary" type="submit">提交完成</button>
                    <p class="visually-hidden" role="status" data-submit-status></p>
                </form>
            </div>
            <div th:if="${!order.canStart() and !order.canComplete()}">
                <h2 id="progress-title">当前进展</h2>
                <p th:switch="${order.status.name()}"><span th:case="'PENDING_CONFIRMATION'">维修结果已提交，等待报修学生确认。无需重复提交。</span><span th:case="'COMPLETED'">报修学生已确认完成，这张工单作为历史任务保留。</span></p>
            </div>
            <a class="return-link" th:href="@{/worker/orders}">返回我的任务</a>
        </aside>
    </div>
    <footer th:replace="~{fragments/student :: footer}"></footer>
</main>
</body>
</html>
